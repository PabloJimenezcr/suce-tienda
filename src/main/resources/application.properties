spring.application.name=suce-tienda

#Para definir el puerto donde escuchará el servidor
server.port=8080

#Para definir la forma de desplegarse en función de ...
spring.main.web-application-type=servlet

#Para definir ...
spring.main.banner-mode=off


#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop
#Conexión NUBE AIVEN la BD Techshop en MySQL
#spring.datasource.url=jdbc:mysql://techshop-techshop-xxxx.aivencloud.com:xxxx/techshop

#Usuario y clave de creaTablas.sql
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar información en el log para desarrollo... en producción se reducen
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE